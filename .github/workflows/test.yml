name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Verify user-story test results
        run: npm run test:stories

      - name: Upload user-story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-stories-node-${{ matrix.node }}
          path: .development/stories-*/
          if-no-files-found: warn
